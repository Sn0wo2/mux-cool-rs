name: Rust Build

on:
  workflow_call:
    inputs:
      ref:
        type: string
      version:
        type: string
      snapshot:
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    working-directory: workspace/mux-cool-rs

env:
  GORELEASER_CURRENT_TAG: ${{ inputs.version && format('v{0}', inputs.version) }}

jobs:
  build:
    name: Build source archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
          path: workspace/mux-cool-rs

      - name: Set up Rust
        if: ${{ inputs.version == '' }}
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        if: ${{ inputs.version == '' }}
        with:
          workspaces: workspace/mux-cool-rs -> target
          shared-key: ${{ github.event.repository.name }}-cargo
          cache-on-failure: true

      - name: Build library
        if: ${{ inputs.version == '' }}
        run: make build

      - name: Install cargo-edit
        if: ${{ !inputs.snapshot }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Sync workspace version
        if: ${{ !inputs.snapshot }}
        env:
          VERSION: ${{ inputs.version }}
        run: cargo set-version --workspace "$VERSION"

      - name: Install GoReleaser
        if: ${{ inputs.version != '' }}
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true

      - name: Package source archive
        if: ${{ inputs.version != '' }}
        run: ${{ inputs.snapshot && 'make release-snapshot' || 'make release' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        if: ${{ inputs.version != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-source-builds
          path: workspace/mux-cool-rs/dist/*.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: ${{ inputs.snapshot && 7 || 30 }}
